[package]
name = "nebula-launcher"
version = "0.1.9"
edition = "2021"
rust-version = "1.77"
license = "MIT"
description = "Nebula Launcher: launcher de Minecraft ligero para Linux"

# Tauri exige su propio workspace; la lógica vive en ../crates/nebula-core.
[workspace]

[lib]
name = "nebula_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
nebula-core = { path = "../crates/nebula-core" }
tokio = { version = "1", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
