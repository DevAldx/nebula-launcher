name: Windows installer test

on:
  push:
    branches:
      - test/windows-installer-0.1.10
  workflow_dispatch:
    inputs:
      version:
        description: "Versión de Nebula a probar"
        required: true
        default: "0.1.10"
      expected_sha256:
        description: "SHA-256 esperado del instalador (opcional)"
        required: false
        default: "63bd7b177bd02606b0ebf9764d6264871238e3fce622e272687ae3d449f98136"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probar instalador y arranque
        shell: pwsh
        env:
          TEST_VERSION: ${{ inputs.version || '0.1.10' }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 || '63bd7b177bd02606b0ebf9764d6264871238e3fce622e272687ae3d449f98136' }}
        run: |
          ./scripts/test-windows-install.ps1 -Version $env:TEST_VERSION -ExpectedSha256 $env:EXPECTED_SHA256

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ inputs.version || '0.1.10' }}
          path: |
            ${{ runner.temp }}/windows-test/report.txt
            ${{ runner.temp }}/windows-test/summary.json
            ${{ runner.temp }}/windows-test/eventlog.txt
            ${{ runner.temp }}/windows-test/installed-files.txt
            ${{ runner.temp }}/windows-test/cdp-targets.json
            ${{ runner.temp }}/windows-test/cdp-output.txt
            ${{ runner.temp }}/windows-test/window-classes.txt
            ${{ runner.temp }}/windows-test/crash-dumps.txt
            ${{ runner.temp }}/windows-test/*.png
          if-no-files-found: warn
