name: Windows installer test

on:
  push:
    branches:
      - test/windows-installer-0.3.1
  workflow_dispatch:
    inputs:
      version:
        description: "Versión de Nebula a probar"
        required: true
        default: "0.3.1"
      expected_sha256:
        description: "SHA-256 esperado del instalador (opcional)"
        required: false
        default: "226b8d1615eb5c2cceacc00de4e243227709b390540840578c595e3998fae73c"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probar instalador y arranque
        shell: pwsh
        env:
          TEST_VERSION: ${{ inputs.version || '0.3.1' }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 || '226b8d1615eb5c2cceacc00de4e243227709b390540840578c595e3998fae73c' }}
        run: |
          ./scripts/test-windows-install.ps1 -Version $env:TEST_VERSION -ExpectedSha256 $env:EXPECTED_SHA256

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ inputs.version || '0.3.1' }}
          path: |
            ${{ runner.temp }}/windows-test/report.txt
            ${{ runner.temp }}/windows-test/summary.json
            ${{ runner.temp }}/windows-test/eventlog.txt
            ${{ runner.temp }}/windows-test/installed-files.txt
            ${{ runner.temp }}/windows-test/cdp-targets.json
            ${{ runner.temp }}/windows-test/cdp-output.txt
            ${{ runner.temp }}/windows-test/window-classes.txt
            ${{ runner.temp }}/windows-test/uia-tree.txt
            ${{ runner.temp }}/windows-test/crash-dumps.txt
            ${{ runner.temp }}/windows-test/*.png
          if-no-files-found: warn
