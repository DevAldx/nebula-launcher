[package]
name = "nebula-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lógica de Nebula Launcher: rutas, configuración, instancias, descargas, Java y lanzamiento"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rand = "0.8"
directories = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

# `keyring` sin features usa el almacén `mock` en memoria: el refresh token se
# perdía al cerrar la app y la cuenta guardada quedaba como una sesión fantasma.
# Cada plataforma necesita su backend nativo para que el token persista.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[lints]
workspace = true
